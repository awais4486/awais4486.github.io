<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awais Ahmed – SOC Analyst | Cyber Enthusiast</title>
  <meta name="description" content="Portfolio of Awais Ahmed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="glow" id="glow"></div>
  <header class="nav">
    <a class="brand" href="#home" id="brand"></a>
    <nav aria-label="Main">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="blob b1"></div><div class="blob b2"></div>
      <p class="status" id="status"></p>
      <h1 id="headline"></h1>
      <p class="lead" id="intro"></p>
      <div class="actions">
        <a class="btn primary" id="btn-contact" href="#contact">Get in touch</a>
        <a class="btn" id="btn-resume" href="#" target="_blank" rel="noopener">View resume</a>
        <a class="btn" id="btn-resume-download" href="#" target="_blank" rel="noopener">Download resume</a>
      </div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

    <section id="about" class="wrap">
      <h2>About me</h2>
      <div class="about-grid">
        <div class="photo" id="photo"></div>
        <div>
          <p id="about-text"></p>
          <p class="loc" id="about-loc"></p>
          <h3>Education</h3>
          <ul class="plain" id="education"></ul>
          <h3>Experience</h3>
          <div id="experience"></div>
        </div>
      </div>
      <h3 class="skills-h">Skills</h3>
      <div id="skills"></div>
      <h3 class="skills-h">Certifications</h3>
      <ul class="plain" id="certs"></ul>
    </section>

    <section id="projects" class="wrap">
      <h2>Projects</h2>
      <div id="project-list"></div>
    </section>

    <section id="contact" class="wrap contact">
      <h2>Contact</h2>
      <p>Have a role, a project or a question? Send a message and I will reply.</p>
      <div class="actions">
        <a class="btn primary" id="c-email" href="#">Email me</a>
        <a class="btn" id="c-phone" href="#">Call</a>
        <a class="btn" id="c-linkedin" href="#">LinkedIn</a>
        <a class="btn" id="c-github" href="#">GitHub</a>
      </div>
    </section>
  </main>

  <footer class="foot"><span id="foot"></span></footer>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
